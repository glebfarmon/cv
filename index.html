<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/icon.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />

		<!-- Preconnect to font CDN if using external fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />

		<!-- Preload critical fonts to prevent FOIT on iOS Safari -->
		<link
			rel="preload"
			href="/src/assets/fonts/inter-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin />

		<!-- Inline critical CSS for instant paint -->
		<style>
			/* Prevent FOIT - show fallback immediately */
			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
				background-color: #242430;
				color: #fcfcfc;
			}
			#root {
				min-height: 100vh;
			}
		</style>

		<!-- Primary Meta Tags -->
		<title>Hlib Ilnytsky - Full Stack Developer Portfolio</title>
		<meta
			name="title"
			content="Hlib Ilnytsky - Full Stack Developer | React & Node.js Portfolio" />
		<meta
			name="description"
			content="Full stack developer specializing in React, TypeScript, Node.js, and modern web technologies. Building scalable applications with focus on user experience and performance." />
		<meta
			name="keywords"
			content="Full Stack Developer, React Developer, TypeScript, Node.js, Web Development, Frontend, Backend, Portfolio" />
		<meta
			name="author"
			content="Hlib Ilnytsky" />

		<!-- Open Graph / Facebook -->
		<meta
			property="og:type"
			content="website" />
		<meta
			property="og:url"
			content="https://glebfarmon.dev/" />
		<meta
			property="og:title"
			content="Hlib Ilnytsky - Full Stack Developer | React & Node.js Portfolio" />
		<meta
			property="og:description"
			content="Full stack developer specializing in React, TypeScript, Node.js, and modern web technologies. Building scalable applications with focus on user experience and performance." />
		<meta
			property="og:image"
			content="/og-image.png" />

		<!-- Twitter -->
		<meta
			property="twitter:card"
			content="summary_large_image" />
		<meta
			property="twitter:url"
			content="https://glebfarmon.dev/" />
		<meta
			property="twitter:title"
			content="Hlib Ilnytsky - Full Stack Developer | React & Node.js Portfolio" />
		<meta
			property="twitter:description"
			content="Full stack developer specializing in React, TypeScript, Node.js, and modern web technologies. Building scalable applications with focus on user experience and performance." />
		<meta
			property="twitter:image"
			content="/og-image.png" />

		<!-- Theme Color -->
		<meta
			name="theme-color"
			content="#00f5c3" />
	</head>
	<body class="dark">
		<div id="root"></div>
		<script
			type="module"
			src="/src/main.tsx"></script>
	</body>
</html>
